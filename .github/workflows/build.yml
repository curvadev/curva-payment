name: Build APK dari ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil File dari Repo
        uses: actions/checkout@v4

      - name: Ekstrak File ZIP
        run: |
          unzip -q Curva.zip -d project_source

      - name: Setup Java JDK 11 (Stabil untuk AIDE)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Mesin Gradle (Versi Klasik)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.8.3'

      - name: Perbaiki Kode Lawas & Build APK
        run: |
          cd project_source
          # Mencari letak folder utama proyek di dalam zip
          GRADLE_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          cd "$GRADLE_DIR"
          
          echo "Memperbaiki minSdkVersion..."
          find . -name "build.gradle" -exec sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' {} +
          
          echo "Mengganti jcenter menjadi mavenCentral..."
          find . -name "*.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +

          echo "Memulai proses build..."
          gradle assembleDebug

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Curva-Payment
          path: project_source/**/build/outputs/apk/debug/*.apk
