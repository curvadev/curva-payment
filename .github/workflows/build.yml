name: Build APK dari ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil File dari Repo
        uses: actions/checkout@v4

      - name: Ekstrak File ZIP
        run: |
          unzip -q Curva.zip -d project_source

      - name: Setup Java JDK 11 (Stabil untuk AIDE)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Mesin Gradle (Versi Klasik)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.8.3'

      - name: Tambal Kode AIDE & Build APK
        run: |
          cd project_source
          GRADLE_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          cd "$GRADLE_DIR"
          
          # Mencari file build.gradle level App dan Root
          APP_GRADLE=$(find . -name "build.gradle" | grep -i "app" | head -n 1)
          ROOT_GRADLE=$(find . -maxdepth 1 -name "build.gradle")
          
          if [ -z "$APP_GRADLE" ]; then APP_GRADLE=$ROOT_GRADLE; fi

          echo "1. Menambal compileSdkVersion & minSdkVersion..."
          # Hapus compileSdkVersion yang lama (jika ada yang formatnya salah)
          sed -i '/compileSdkVersion/d' $APP_GRADLE
          # Sisipkan compileSdkVersion 34 tepat di bawah tulisan 'android {'
          sed -i '/android {/a \    compileSdkVersion 34' $APP_GRADLE
          # Paksa minSdk menjadi 24
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' $APP_GRADLE
          
          echo "2. Menambal Google Services Plugin..."
          # Tambahkan repo google() agar mesin bisa mengunduh plugin Firebase/Google
          find . -name "*.gradle" -exec sed -i '/repositories {/a \        google()' {} +
          # Sisipkan alamat plugin google-services ke root build.gradle
          if [ -n "$ROOT_GRADLE" ]; then
            sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.3.15"' $ROOT_GRADLE
          fi

          echo "3. Mengganti jcenter yang mati menjadi mavenCentral..."
          find . -name "*.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +

          echo "4. Memulai proses build..."
          gradle assembleDebug

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Curva-Payment
          path: project_source/**/build/outputs/apk/debug/*.apk
