name: Build Release Final (Murni GitHub)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Kode Murni dari Repo
        uses: actions/checkout@v4

      - name: Setup Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Mesin Gradle Klasik
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.8.3'

      - name: Tambal Kode & Trik API 34 Play Store
        run: |
          echo "1. Mematikan kode usang Android 14..."
          find . -name "*.java" -exec sed -i 's/.*setAppCacheEnabled.*/\/\/ &/' {} +
          find . -name "*.java" -exec sed -i 's/.*setAppCachePath.*/\/\/ &/' {} +
          
          echo "2. Setup Plugin Google Services..."
          cat <<EOF > new_root.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:4.1.0'; classpath 'com.google.gms:google-services:4.3.15' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          if [ -f "build.gradle" ]; then sed -i 's/jcenter()/mavenCentral()/g' build.gradle; cat build.gradle >> new_root.gradle; fi
          mv new_root.gradle build.gradle
          
                    echo "3. Trik Play Store (Compile 36, Target 36)..."
          APP_GRADLE=$(find . -name "build.gradle" | grep -i "app" | head -n 1)
          if [ -z "$APP_GRADLE" ]; then APP_GRADLE="build.gradle"; fi
          
          sed -i 's/jcenter()/mavenCentral()/g' "$APP_GRADLE"
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 33/g' "$APP_GRADLE"
          sed -i -E 's/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion 34/g' "$APP_GRADLE"
          sed -i -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 24/g' "$APP_GRADLE"

      - name: Build APK dan AAB Release
        run: |
          gradle assembleRelease bundleRelease

      - name: Tandatangani (Sign) dengan Kunci Tetap
        run: |
          echo "1. Mencari Alat Penandatangan (apksigner)..."
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          
          echo "2. Mencari file APK dan AAB mentah..."
          APK_FILE=$(find . -name "*-unsigned.apk" | head -n 1)
          AAB_FILE=$(find . -name "*.aab" | head -n 1)
          
          echo "3. Menandatangani menggunakan Kunci Master..."
          $APKSIGNER sign --ks KUNCI-RAHASIA.keystore --ks-pass pass:curvapayment123 --key-pass pass:curvapayment123 --ks-key-alias curva_alias "$APK_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore KUNCI-RAHASIA.keystore -storepass curvapayment123 -keypass curvapayment123 "$AAB_FILE" curva_alias
          
          echo "4. Mengumpulkan hasil..."
          mkdir -p Hasil_Siap_Publish
          cp "$APK_FILE" Hasil_Siap_Publish/CurvaPayment-API34.apk
          cp "$AAB_FILE" Hasil_Siap_Publish/CurvaPayment-API34.aab

      - name: Download Hasil Akhir
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-CurvaPayment-Final
          path: Hasil_Siap_Publish/*
