name: Build APK dari ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil File dari Repo
        uses: actions/checkout@v4

      - name: Ekstrak File ZIP
        run: |
          unzip -q Curva.zip -d project_source

      - name: Setup Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Mesin Gradle Klasik
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.8.3'

      - name: Tambal Kode AIDE Secara Paksa (Ultimate)
        run: |
          # Masuk ke folder Curva di dalam zip
          cd project_source/Curva || cd project_source/*
          
          echo "1. Memasang Plugin Google Services di Root..."
          # Menulis paksa alamat unduh ke file utama
          cat <<EOF > new_root.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:4.1.0'
                  classpath 'com.google.gms:google-services:4.3.15'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          if [ -f "build.gradle" ]; then
              sed -i 's/jcenter()/mavenCentral()/g' build.gradle
              cat build.gradle >> new_root.gradle
          fi
          mv new_root.gradle build.gradle
          
          echo "2. Memasang Versi SDK di App..."
          APP_GRADLE="app/build.gradle"
          sed -i 's/jcenter()/mavenCentral()/g' $APP_GRADLE
          
          # Jika compileSdk tidak ada, selipkan tepat di bawah 'android {'
          if ! grep -q "compileSdkVersion" $APP_GRADLE; then
              sed -i -E 's/android[[:space:]]*\{/android {\n    compileSdkVersion 34\n/g' $APP_GRADLE
          fi
          
          # Jika blok defaultConfig tidak ada, buat baru untuk minSdk 24
          if ! grep -q "defaultConfig" $APP_GRADLE; then
              sed -i -E 's/android[[:space:]]*\{/android {\n    defaultConfig {\n        minSdkVersion 24\n        targetSdkVersion 34\n    }\n/g' $APP_GRADLE
          else
              # Jika ada, ganti angkanya saja
              if ! grep -q "minSdkVersion" $APP_GRADLE; then
                  sed -i -E 's/defaultConfig[[:space:]]*\{/defaultConfig {\n        minSdkVersion 24\n/g' $APP_GRADLE
              else
                  sed -i -E 's/minSdkVersion.*/minSdkVersion 24/g' $APP_GRADLE
              fi
          fi

      - name: Kompilasi APK (Build)
        run: |
          cd project_source/Curva || cd project_source/*
          gradle assembleDebug

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Curva-Payment
          path: project_source/**/app/build/outputs/apk/debug/*.apk
