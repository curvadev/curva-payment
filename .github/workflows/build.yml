name: Build APK Stabil (API 33 Edition)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil File dari Repo
        uses: actions/checkout@v4

      - name: Ekstrak File ZIP
        run: |
          unzip -q Curva.zip -d project_source

      - name: Setup Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Mesin Gradle Klasik
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.8.3'

      - name: Tambal Kode & Build APK
        run: |
          cd project_source/Curva || cd project_source/*
          
          # 1. Membersihkan kode Cache
          find . -name "*.java" -exec sed -i 's/.*setAppCacheEnabled.*/\/\/ &/' {} +
          find . -name "*.java" -exec sed -i 's/.*setAppCachePath.*/\/\/ &/' {} +
          
          # 2. Setup Repo
          cat <<EOF > new_root.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:4.1.0'
                  classpath 'com.google.gms:google-services:4.3.15'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          if [ -f "build.gradle" ]; then
              sed -i 's/jcenter()/mavenCentral()/g' build.gradle
              cat build.gradle >> new_root.gradle
          fi
          mv new_root.gradle build.gradle
          
          # 3. Setting SDK ke 33
          APP_GRADLE=$(find . -name "build.gradle" | grep -i "app" | head -n 1)
          if [ -z "$APP_GRADLE" ]; then APP_GRADLE="build.gradle"; fi
          
          sed -i 's/jcenter()/mavenCentral()/g' "$APP_GRADLE"
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 33/g' "$APP_GRADLE"
          sed -i -E 's/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion 33/g' "$APP_GRADLE"
          sed -i -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 24/g' "$APP_GRADLE"
          
          # 4. KEMBALI KE DEBUG AGAR OTOMATIS DITANDATANGANI DAN BISA DIINSTAL
          gradle assembleDebug

      - name: Upload APK Hasil
        uses: actions/upload-artifact@v4
        with:
          name: App-Curva-Payment-API33
          path: project_source/**/app/build/outputs/apk/debug/*.apk
